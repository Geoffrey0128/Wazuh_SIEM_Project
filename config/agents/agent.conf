<!--
  Configuration centralisée des agents
  À déployer sur le manager : /var/ossec/etc/shared/default/agent.conf
  Poussée automatiquement vers les agents du groupe "default".
-->

<agent_config>

  <!-- ===== FIM (File Integrity Monitoring) ===== -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>

    <!-- Surveillance temps réel de /etc -->
    <directories check_all="yes" realtime="yes">/etc</directories>

    <!-- Binaires système critiques -->
    <directories check_all="yes">/bin,/sbin,/usr/bin,/usr/sbin</directories>

    <!-- Ignorer les fichiers très volatils -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore type="sregex">.log$|.swp$</ignore>
  </syscheck>

  <!-- ===== SCA (Security Configuration Assessment) ===== -->
  <sca>
    <enabled>yes</enabled>
  </sca>

</agent_config>

<!--
  ===== Bloc spécifique Windows (Sysmon) =====
  À placer plutôt dans un groupe "windows" dédié.
  Collecte du canal Sysmon pour enrichir la détection :

  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
