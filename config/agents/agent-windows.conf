<!--
  Configuration de l'agent Windows (édition manuelle locale, pas de push centralisé).
  Sur la VM agent-windows : ouvrir avec notepad "C:\Program Files (x86)\ossec-agent\ossec.conf"
  et insérer le bloc ci-dessous à l'intérieur de <ossec_config>, puis redémarrer le service Wazuh.
-->

<!-- ===== Collecte Sysmon (enrichissement des logs Windows) ===== -->
<localfile>
  <location>Microsoft-Windows-Sysmon/Operational</location>
  <log_format>eventchannel</log_format>
</localfile>
